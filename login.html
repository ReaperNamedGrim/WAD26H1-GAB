<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./res/css/style.css" rel="stylesheet">
    <link href="./res/css/header.css" rel="stylesheet">
    <link href="./res/css/article.css" rel="stylesheet">
    <link href="./res/css/footer.css" rel="stylesheet">
    <link href="./res/css/login-card.css" rel="stylesheet">
    <title>WADBook - login</title>
</head>
<body>
    <header>
        <nav>
            <div class="header__links">
                <a href="#">Home</a>
            </div>


            <a class="header__profile" href="./login.html">
                <img src="./res/images/profile.png" alt="user profile">
            </a>
        </nav>
    </header>

    <main class="main-container">
        <div class="login-card">
        <h2>Welcome to PostIt</h2>

        <a href="" class="link-account">Create an account</a>

        <p>or</p>
        <p>Please log in</p>
        <form action="./index.html" method="GET" class="login-form">

            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Log in</button>
        </form>

        <a href="" class="link-forgot">Forget password</a>
        </div>
    </main>
</body>
</html>

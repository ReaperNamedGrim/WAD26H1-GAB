<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./res/css/style.css" rel="stylesheet">
    <link href="./res/css/header.css" rel="stylesheet">
    <link href="./res/css/article.css" rel="stylesheet">
    <link href="./res/css/footer.css" rel="stylesheet">
    <link href="./res/css/login-card.css" rel="stylesheet">
    <title>WADBook - login</title>
</head>
<body>
    <header>
        <nav>
            <div class="header__links">
                <a href="./index.html">Home</a>
            </div>


            <div class="profile-container">
                <a class="header__profile" id="profile-icon" href="./login.html">
                    <img src="./res/images/profile.png" alt="user profile">
                </a>
                <!-- Dropdown menu (initially hidden via CSS) -->
                <div id="profile-dropdown" class="dropdown-menu" style="display: none;">
                    <b><p id="dropdown-name">Name</p></b>
                    <p id="dropdown-email">email@ut.ee</p>
                    <a href="#" id="logout-btn">Logout</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-container">
        <div class="login-card">
        <h2>Welcome to PostIt</h2>

        <a href="" class="link-account">Create an account</a>

        <p>or</p>
        <p>Please log in</p>
        <form action="./index.html" method="GET" class="login-form">

            <input type="name" name="name" placeholder="Name" required>

            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Log in</button>
        </form>

        <a href="" class="link-forgot">Forget password</a>
        </div>
    </main>
    <script src="./src/js/header.js"></script>
    <script src="./src/js/login.js"></script>
</body>
</html>

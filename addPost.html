<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./res/css/style.css" rel="stylesheet" />
    <link href="./res/css/header.css" rel="stylesheet" />
    <link href="./res/css/article.css" rel="stylesheet" />
    <link href="./res/css/footer.css" rel="stylesheet" />
    <link href="./res/css/post-card.css" rel="stylesheet" />
    <title>WADBook - addPost</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="header__links">
          <a href="./index.html">Home</a>
        </div>

            <div class="profile-container">
                <a class="header__profile" id="profile-icon" href="./login.html">
                    <img src="./res/images/profile.png" alt="user profile">
                </a>
                <!-- Dropdown menu (initially hidden via CSS) -->
                <div id="profile-dropdown" class="dropdown-menu" style="display: none;">
                    <b><p id="dropdown-name">Name</p></b>
                    <p id="dropdown-email">email@ut.ee</p>
                    <a href="#" id="logout-btn">Logout</a>
                </div>
            </div>
      </nav>
    </header>

    <main class="main-container">
      <div class="card">
        <form action="./index.html" method="GET" class="post-form">
          <fieldset class="form-group">
            <label for="post-body">Post body</label>
            <textarea
              name="post-body"
              id="post-body"
              placeholder="textarea"
            ></textarea>
          </fieldset>

          <fieldset class="form-group">
            <label for="post-file">Select file</label>
            <input type="file" name="post-file" id="post-file" />
          </fieldset>

          <button type="submit">Create Post</button>
        </form>
      </div>
    </main>
    <script src="./src/js/header.js"></script>
  </body>
</html>

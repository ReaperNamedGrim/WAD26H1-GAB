<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./res/css/style.css" rel="stylesheet" />
    <link href="./res/css/header.css" rel="stylesheet" />
    <link href="./res/css/article.css" rel="stylesheet" />
    <link href="./res/css/footer.css" rel="stylesheet" />
    <link href="./res/css/post-card.css" rel="stylesheet" />
    <title>WADBook - addPost</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="header__links">
          <a href="./index.html">Home</a>
        </div>

        <a class="header__profile" href="./login.html">
          <img src="./res/images/profile.png" alt="user profile" />
        </a>
      </nav>
    </header>

    <main class="main-container">
      <div class="card">
        <form action="./index.html" method="GET" class="post-form">
          <fieldset class="form-group">
            <label for="post-body">Post body</label>
            <textarea
              name="post-body"
              id="post-body"
              placeholder="textarea"
            ></textarea>
          </fieldset>

          <fieldset class="form-group">
            <label for="post-file">Select file</label>
            <input type="file" name="post-file" id="post-file" />
          </fieldset>

          <button type="submit">Create Post</button>
        </form>
      </div>
    </main>
  </body>
</html>
